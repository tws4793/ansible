- name: Install pyenv and required dependencies
  hosts: localhost
  become: true  # Run as sudo
  vars:
    pyenv_root: "{{ ansible_env.HOME }}/.pyenv"

  tasks:
    - name: Install system dependencies for pyenv
      package:
        name:
          - build-essential
          - curl
          - git
          - libbz2-dev
          - libffi-dev
          - liblzma-dev
          - libncursesw5-dev
          - libreadline-dev
          - libsqlite3-dev
          - libssl-dev
          - libxml2-dev
          - libxmlsec1-dev
          - make
          - tk-dev
          - wget
          - xz-utils
          - zlib1g-dev
        state: present

    - name: Clone pyenv repository
      git:
        repo: "https://github.com/pyenv/pyenv.git"
        dest: "{{ pyenv_root }}"
        update: yes

    - name: Add pyenv to PATH in .bashrc
      lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: |
          export PYENV_ROOT="{{ pyenv_root }}"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init --path)"
        create: yes
        insertafter: EOF

    - name: Ensure pyenv is loaded in the current shell
      shell: |
        export PYENV_ROOT="{{ pyenv_root }}"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
      args:
        executable: /bin/bash

    - name: Install Python 3.7.16 using pyenv
      shell: |
        export PYENV_ROOT="{{ pyenv_root }}"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
        pyenv install 3.7.16
      args:
        executable: /bin/bash
      register: pyenv_install

    - name: Set Python 3.7.16 as the global default
      shell: |
        export PYENV_ROOT="{{ pyenv_root }}"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
        pyenv global 3.7.16
      args:
        executable: /bin/bash

