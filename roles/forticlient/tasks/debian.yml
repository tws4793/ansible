---
- name: Install NetworkManager fortisslvpn plugin
  become: true
  ansible.builtin.apt:
    name: network-manager-fortisslvpn-gnome
    state: present

- name: Install FortiClient VPN
  when: forticlient_official_client
  block:
    - name: Install FortiClient dependencies
      become: true
      ansible.builtin.apt:
        deb: "{{ item }}"
      loop: "{{ forticlient_deb_deps }}"

    - name: Install FortiClient VPN
      become: true
      ansible.builtin.apt:
        deb: "{{ forticlient_deb }}"
